<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}橘貓代購後台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css?v=24">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark"><i class="bi bi-heart"></i></span>
            <span class="brand-name">橘貓代購</span>
        </div>
        <div class="menu-title">後台管理</div>

        <a class="menu-item {% if request.url.path == '/' %}active{% endif %}" href="/">
            <span class="menu-icon"><i class="bi bi-grid-1x2"></i></span>
            <span class="menu-label">儀表板</span>
        </a>

        <a class="menu-item {% if request.url.path == '/orders' or request.url.path.startswith('/orders/search') %}active{% endif %}" href="/orders">
            <span class="menu-icon"><i class="bi bi-search"></i></span>
            <span class="menu-label">訂單查詢</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/orders/new') %}active{% endif %}" href="/orders/new">
            <span class="menu-icon"><i class="bi bi-plus-square"></i></span>
            <span class="menu-label">新增訂單</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/inbound') %}active{% endif %}" href="/inbound">
            <span class="menu-icon"><i class="bi bi-box-arrow-in-down"></i></span>
            <span class="menu-label">入庫管理</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/shipping') %}active{% endif %}" href="/shipping">
            <span class="menu-icon"><i class="bi bi-truck"></i></span>
            <span class="menu-label">出貨管理</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/members') %}active{% endif %}" href="/members">
            <span class="menu-icon"><i class="bi bi-people"></i></span>
            <span class="menu-label">會員管理</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/profit') %}active{% endif %}" href="/profit">
            <span class="menu-icon"><i class="bi bi-graph-up"></i></span>
            <span class="menu-label">利潤報表</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/frontend-settings') %}active{% endif %}" href="/frontend-settings">
            <span class="menu-icon"><i class="bi bi-megaphone"></i></span>
            <span class="menu-label">前台設定</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/forwarding-registers') %}active{% endif %}" href="/forwarding-registers">
            <span class="menu-icon"><i class="bi bi-box-arrow-in-right"></i></span>
            <span class="menu-label">集運登記</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/feedbacks') %}active{% endif %}" href="/feedbacks">
            <span class="menu-icon"><i class="bi bi-chat-dots"></i></span>
            <span class="menu-label">匿名回饋</span>
        </a>

        <a class="menu-item {% if request.url.path.startswith('/audit-logs') %}active{% endif %}" href="/audit-logs">
            <span class="menu-icon"><i class="bi bi-clock-history"></i></span>
            <span class="menu-label">操作紀錄</span>
        </a>
    </aside>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>

<script>
(function () {
  const iconMap = new Map([
    ['🔍', 'bi-search'], ['📦', 'bi-box-seam'], ['🚚', 'bi-truck'],
    ['👤', 'bi-people'], ['📊', 'bi-graph-up'], ['💬', 'bi-chat-dots'],
    ['🕘', 'bi-clock-history'], ['🧡', 'bi-heart'], ['📥', 'bi-download'],
    ['📤', 'bi-upload'], ['📨', 'bi-envelope-paper'], ['📅', 'bi-calendar3'],
    ['✅', 'bi-check2-circle'], ['❌', 'bi-x-circle'], ['✏️', 'bi-pencil'],
    ['🗑', 'bi-trash3'], ['🧾', 'bi-receipt'], ['📋', 'bi-list-ul'],
    ['💰', 'bi-cash-stack'], ['🧹', 'bi-eraser'], ['⚠️', 'bi-exclamation-triangle'],
    ['📣', 'bi-megaphone'], ['⏰', 'bi-clock'], ['📮', 'bi-mailbox'],
    ['⚙️', 'bi-gear'], ['🔄', 'bi-arrow-repeat'], ['💾', 'bi-floppy'],
    ['➕', 'bi-plus-square'], ['＋', 'bi-plus-square'], ['🏠', 'bi-house'],
    ['📈', 'bi-graph-up-arrow'], ['📉', 'bi-graph-down-arrow'], ['📁', 'bi-folder2-open']
  ]);

  function replaceLeadingEmoji(el) {
    if (!el || el.dataset.lineIconProcessed === '1') return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const raw = node.nodeValue || '';
      const trimmed = raw.trimStart();
      for (const [emoji, iconClass] of iconMap.entries()) {
        if (trimmed.startsWith(emoji)) {
          const lead = raw.slice(0, raw.length - trimmed.length);
          const rest = trimmed.slice(emoji.length).trimStart();
          const frag = document.createDocumentFragment();
          if (lead) frag.appendChild(document.createTextNode(lead));
          const icon = document.createElement('i');
          icon.className = `bi ${iconClass} auto-line-icon`;
          icon.setAttribute('aria-hidden', 'true');
          frag.appendChild(icon);
          if (rest) frag.appendChild(document.createTextNode(rest));
          node.parentNode.replaceChild(frag, node);
          el.dataset.lineIconProcessed = '1';
          return;
        }
      }
    }
    el.dataset.lineIconProcessed = '1';
  }

  function normalizeIcons(root) {
    const selector = [
      '.page-header h1', '.page-header h2', '.ship-card h2', '.ship-header h2',
      'button', 'summary', '.ship-page-tab', '.member-orders-title',
      '.audit-action', '.empty-state', '.detail-edit-button'
    ].join(',');
    if (root.matches && root.matches(selector)) replaceLeadingEmoji(root);
    if (root.querySelectorAll) root.querySelectorAll(selector).forEach(replaceLeadingEmoji);
  }

  document.addEventListener('DOMContentLoaded', () => normalizeIcons(document));
  document.body.addEventListener('htmx:afterSwap', (event) => normalizeIcons(event.target));
  const observer = new MutationObserver((mutations) => {
    for (const mutation of mutations) {
      mutation.addedNodes.forEach((node) => {
        if (node.nodeType === 1) normalizeIcons(node);
      });
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>

</body>
</html>
