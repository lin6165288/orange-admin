<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        橘貓代購後台
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- HTMX -->
    <script
        src="https://unpkg.com/htmx.org@2.0.4"
    ></script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/style.css') }}"
    >
</head>


<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            🧡 橘貓代購
        </div>

        <div class="menu-title">
            後台管理
        </div>

        <a class="menu-item active" href="/">
            ▣ 儀表板
        </a>

        <a class="menu-item" href="#">
            🔍 訂單查詢
        </a>

        <a class="menu-item" href="#">
            ＋ 新增訂單
        </a>

        <a class="menu-item" href="#">
            📦 入庫管理
        </a>

        <a class="menu-item" href="#">
            🚚 出貨管理
        </a>

        <a class="menu-item" href="#">
            👤 會員管理
        </a>

        <a class="menu-item" href="#">
            📊 利潤報表
        </a>

        <a class="menu-item" href="#">
            💬 匿名回饋
        </a>

    </aside>


    <main class="content">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>
</html>
