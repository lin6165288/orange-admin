<!DOCTYPE html>

<html lang="zh-TW">

<head>

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>
        {% block title %}
        橘貓代購後台
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- HTMX -->

    <script
        src="https://unpkg.com/htmx.org@2.0.4"
    ></script>


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="/static/style.css?v=12"
    >

</head>


<body>


<div class="app">


    <!-- Sidebar -->

    <aside class="sidebar">


        <div class="brand">

            🧡 橘貓代購

        </div>


        <div class="menu-title">

            後台管理

        </div>


        <a
            class="menu-item
            {% if request.url.path == '/' %}
            active
            {% endif %}"
            href="/"
        >

            ▣ 儀表板

        </a>


        <a
            class="menu-item
            {% if request.url.path == '/orders' or request.url.path.startswith('/orders/search') %}
            active
            {% endif %}"
            href="/orders"
        >

            🔍 訂單查詢

        </a>


        <a
            class="menu-item {% if request.url.path.startswith('/orders/new') %}active{% endif %}"
            href="/orders/new"
        >
            ＋ 新增訂單
        </a>


        <a
            class="menu-item"
            href="#"
        >

            📦 入庫管理

        </a>


        <a
            class="menu-item"
            href="#"
        >

            🚚 出貨管理

        </a>


        <a
            class="menu-item"
            href="#"
        >

            👤 會員管理

        </a>


        <a
            class="menu-item"
            href="#"
        >

            📊 利潤報表

        </a>


        <a
            class="menu-item"
            href="#"
        >

            💬 匿名回饋

        </a>


        <a
            class="menu-item
            {% if request.url.path.startswith('/audit-logs') %}
            active
            {% endif %}"
        
            href="/audit-logs"
        >
            🕘 操作紀錄
        </a>


    </aside>


    <!-- Main -->

    <main class="content">

        {% block content %}

        {% endblock %}

    </main>


</div>


</body>

</html>
