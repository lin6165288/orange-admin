{% if success_id %}
<div class="create-success" role="status">
    ✅ 訂單 <strong>#{{ success_id }}</strong> 已新增，並寫入操作紀錄。
    <a href="/orders?new={{ success_id }}">前往訂單查詢</a>
</div>
{% endif %}
{% if error_message %}
<div class="create-error" role="alert">{{ error_message }}</div>
{% endif %}
<section class="create-card">
    <form id="create-order-form" hx-post="/orders/new" hx-target="#new-order-panel" hx-swap="innerHTML" hx-indicator="#create-loading">
        <div class="create-heading">基本資料</div>
        <div class="edit-full-grid">
            <div class="edit-field create-field">
                <label for="new-name">客戶姓名 <b class="required">*</b></label>
                <input id="new-name" name="customer_name" type="text" list="new-name-options" value="{{ customer_name }}" maxlength="50" autocomplete="off" placeholder="輸入客戶姓名" required
                       hx-get="/orders/new/fee" hx-trigger="input changed delay:350ms" hx-include="#create-order-form" hx-target="#fee-preview" hx-swap="innerHTML">
                <datalist id="new-name-options">
                    {% for item in customer_names %}<option value="{{ item }}"></option>{% endfor %}
                </datalist>
            </div>
            <div class="edit-field create-field">
                <label for="new-date">下單日期 <b class="required">*</b></label>
                <input id="new-date" name="order_time" type="date" value="{{ order_time }}" required>
            </div>
            <div class="edit-field create-field">
                <label for="new-platform">下單平台</label>
                <select id="new-platform" name="platform"
                        hx-get="/orders/new/fee" hx-trigger="change" hx-include="#create-order-form" hx-target="#fee-preview" hx-swap="innerHTML">
                    {% for item in platforms %}<option value="{{ item }}" {% if item == platform %}selected{% endif %}>{{ item }}</option>{% endfor %}
                </select>
            </div>
            <div class="edit-field create-field">
                <label for="new-tracking">包裹單號</label>
                <input id="new-tracking" name="tracking_number" type="text" value="{{ tracking_number }}" maxlength="50" placeholder="輸入物流單號" autocomplete="off">
            </div>
            <div class="edit-field create-field">
                <label for="new-amount">訂單金額（人民幣）</label>
                <input id="new-amount" name="amount_rmb" type="number" value="{{ amount_rmb }}" min="0" max="99999999.99" step="0.01" required
                       hx-get="/orders/new/fee" hx-trigger="input changed delay:350ms" hx-include="#create-order-form" hx-target="#fee-preview" hx-swap="innerHTML">
            </div>
            <div class="edit-field create-field">
                <label for="new-weight">包裹公斤數</label>
                <input id="new-weight" name="weight_kg" type="number" value="{{ weight_kg }}" min="0" max="99999999.99" step="0.01" required>
            </div>
        </div>

        <div class="create-payment-block">
            <div class="create-heading">採購付款方式</div>
            <div class="payment-method-switch" role="radiogroup" aria-label="採購付款方式">
                <label class="payment-method-option">
                    <input type="radio" name="purchase_payment_method" value="alipay"
                           {% if purchase_payment_method != 'card' %}checked{% endif %}
                           onchange="toggleCardCostField()">
                    <span><i class="bi bi-wallet2"></i> 支付寶</span>
                </label>
                <label class="payment-method-option">
                    <input type="radio" name="purchase_payment_method" value="card"
                           {% if purchase_payment_method == 'card' %}checked{% endif %}
                           onchange="toggleCardCostField()">
                    <span><i class="bi bi-credit-card"></i> 刷卡</span>
                </label>
            </div>
            <div id="card-cost-field" class="edit-field create-field card-cost-field {% if purchase_payment_method != 'card' %}is-hidden{% endif %}">
                <label for="new-card-cost">刷卡金額（台幣成本）</label>
                <div class="input-prefix">
                    <span>NT$</span>
                    <input id="new-card-cost" name="card_cost_twd" type="number"
                           value="{{ card_cost_twd }}" min="0" max="999999999.99" step="0.01"
                           placeholder="輸入本單實際刷卡台幣金額">
                </div>
            </div>
        </div>
        <div class="create-payment-block customer-payment-block">
            <div class="create-heading">客戶付款方式</div>
            <div class="payment-method-switch" role="radiogroup" aria-label="客戶付款方式">
                <label class="payment-method-option">
                    <input type="radio" name="customer_payment_method" value="bank_transfer"
                           {% if customer_payment_method == 'bank_transfer' %}checked{% endif %}
                           hx-get="/orders/new/fee" hx-trigger="change" hx-include="#create-order-form" hx-target="#fee-preview" hx-swap="innerHTML">
                    <span><i class="bi bi-bank"></i> 銀行轉帳</span>
                </label>
                <label class="payment-method-option">
                    <input type="radio" name="customer_payment_method" value="balance"
                           {% if customer_payment_method == 'balance' %}checked{% endif %}
                           hx-get="/orders/new/fee" hx-trigger="change" hx-include="#create-order-form" hx-target="#fee-preview" hx-swap="innerHTML">
                    <span><i class="bi bi-cash-stack"></i> 餘額扣款</span>
                </label>
                <label class="payment-method-option">
                    <input type="radio" name="customer_payment_method" value="cod"
                           {% if customer_payment_method == 'cod' %}checked{% endif %}
                           hx-get="/orders/new/fee" hx-trigger="change" hx-include="#create-order-form" hx-target="#fee-preview" hx-swap="innerHTML">
                    <span><i class="bi bi-box-seam"></i> 貨到付款</span>
                </label>
            </div>
        </div>

        <div class="create-fee-area">
            <div class="create-heading">代購手續費</div>
            <div id="fee-preview">
                {% include "new_order_fee.html" %}
            </div>
        </div>
        <div class="edit-status-box create-status">
            <label class="edit-checkbox"><input type="checkbox" name="is_arrived" value="1" {% if is_arrived %}checked{% endif %}> 已到倉</label>
            <label class="edit-checkbox"><input type="checkbox" name="is_returned" value="1" {% if is_returned %}checked{% endif %}> 已運回</label>
        </div>
        <div class="edit-field edit-remarks create-field">
            <label for="new-remarks">備註（選填）</label>
            <textarea name="remarks" id="new-remarks" rows="3" placeholder="輸入備註">{{ remarks }}</textarea>
        </div>
        <div class="create-footer">
            <label class="edit-checkbox"><input type="checkbox" name="keep_last_name" value="1" {% if keep_last_name %}checked{% endif %}> 新增後保留此客戶姓名</label>
            <div class="create-actions"><span id="create-loading" class="htmx-indicator">新增中…</span><button type="submit" class="edit-save">✅ 新增訂單</button></div>
        </div>
    </form>
</section>

<script>
function toggleCardCostField() {
    const selected = document.querySelector('input[name="purchase_payment_method"]:checked');
    const block = document.getElementById('card-cost-field');
    const input = document.getElementById('new-card-cost');
    if (!selected || !block || !input) return;
    const isCard = selected.value === 'card';
    block.classList.toggle('is-hidden', !isCard);
    input.required = isCard;
    if (!isCard) input.value = '';
}
toggleCardCostField();
</script>
