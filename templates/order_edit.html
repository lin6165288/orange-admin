<div class="order-edit-card">


    <div class="detail-header">


        <div>

            <strong>

                編輯訂單 #{{ order.order_id }}

            </strong>


            <span class="detail-subtitle">

                {{ order.customer_name or "-" }}

            </span>

        </div>


        <button

            type="button"

            class="detail-close"

            hx-get="/orders/{{ order.order_id }}/detail"

            hx-target="#detail-{{ order.order_id }}"

            hx-swap="innerHTML"

        >

            取消 ×

        </button>


    </div>


    <form

        hx-post="/orders/{{ order.order_id }}/edit"

        hx-target="#detail-{{ order.order_id }}"

        hx-swap="innerHTML"

    >


        <div class="edit-grid">


            <div class="edit-field">


                <label>

                    重量（kg）

                </label>


                <input

                    type="number"

                    name="weight_kg"

                    value="{{ order.weight_kg if order.weight_kg is not none else '' }}"

                    min="0"

                    step="0.01"

                >


            </div>


            <div class="edit-check-group">


                <label class="edit-checkbox">


                    <input

                        type="checkbox"

                        name="is_arrived"

                        value="1"

                        {% if order.is_arrived %}
                        checked
                        {% endif %}

                    >


                    已到貨


                </label>


                <label class="edit-checkbox">


                    <input

                        type="checkbox"

                        name="is_returned"

                        value="1"

                        {% if order.is_returned %}
                        checked
                        {% endif %}

                    >


                    已運回


                </label>


            </div>


        </div>


        <div class="edit-field edit-remarks">


            <label>

                備註

            </label>


            <textarea

                name="remarks"

                rows="4"

                placeholder="輸入訂單備註"

            >{{ order.remarks or "" }}</textarea>


        </div>


        <div class="edit-actions">


            <button

                type="button"

                class="edit-cancel"

                hx-get="/orders/{{ order.order_id }}/detail"

                hx-target="#detail-{{ order.order_id }}"

                hx-swap="innerHTML"

            >

                取消

            </button>


            <button

                type="submit"

                class="edit-save"

            >

                儲存變更

            </button>


        </div>


    </form>


</div>
