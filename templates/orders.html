{% extends "base.html" %}
{% block title %}訂單管理｜橘貓代購{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1><span class="page-title-icon"><i class="bi bi-search"></i></span>訂單管理</h1>
    <p>整合訂單總表、搜尋與編輯。預設直接顯示最近 100 筆訂單。</p>
  </div>
  <a class="search-button orders-new-link" href="/orders/new">
    <i class="bi bi-plus-square"></i><span>新增訂單</span>
  </a>
</div>

<section class="search-card">
  <form
    id="order-search-form"
    hx-get="/orders/search"
    hx-target="#order-results"
    hx-swap="innerHTML"
    hx-indicator="#order-search-loading"
  >
    <div class="search-grid">
      <div class="search-field">
        <label>訂單編號</label>
        <input name="search_order_id" inputmode="numeric" value="{{ search_order_id }}" placeholder="精準搜尋">
      </div>

      <div class="search-field">
        <label>客戶姓名</label>
        <input name="search_customer_name" value="{{ search_customer_name }}" placeholder="可輸入部分姓名">
      </div>

      <div class="search-field">
        <label>包裹單號</label>
        <input name="search_tracking_number" value="{{ search_tracking_number }}" placeholder="可輸入部分單號">
      </div>

      <div class="search-field">
        <label>人民幣金額</label>
        <div class="search-prefix">
          <span>¥</span>
          <input name="search_amount_rmb" inputmode="decimal" value="{{ search_amount_rmb }}" placeholder="精準金額">
        </div>
      </div>

      <div class="search-field">
        <label>平台</label>
        <select name="search_platform">
          <option value="">全部平台</option>
          {% for platform in platforms %}
          <option value="{{ platform }}" {% if search_platform == platform %}selected{% endif %}>{{ platform }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="search-field">
        <label>下單日期</label>
        <input type="date" name="search_order_date" value="{{ search_order_date }}">
      </div>

      <div class="search-field">
        <label>到貨狀態</label>
        <select name="search_arrived_status">
          <option value="" {% if not search_arrived_status %}selected{% endif %}>全部</option>
          <option value="arrived" {% if search_arrived_status == 'arrived' %}selected{% endif %}>已到貨</option>
          <option value="unarrived" {% if search_arrived_status == 'unarrived' %}selected{% endif %}>未到貨</option>
        </select>
      </div>

      <div class="search-field">
        <label>運回狀態</label>
        <select name="search_returned_status">
          <option value="" {% if not search_returned_status %}selected{% endif %}>全部</option>
          <option value="returned" {% if search_returned_status == 'returned' %}selected{% endif %}>已運回</option>
          <option value="unreturned" {% if search_returned_status == 'unreturned' %}selected{% endif %}>未運回</option>
        </select>
      </div>
    </div>

    <div class="search-footer">
      <div class="orders-search-hint">
        <i class="bi bi-info-circle"></i>
        <span>不輸入條件時會顯示最近 100 筆；有篩選時最多顯示 300 筆。</span>
      </div>
      <div class="search-actions">
        <a class="clear-filter-button" href="/orders"><i class="bi bi-arrow-counterclockwise"></i><span>清除</span></a>
        <button class="search-button" type="submit"><i class="bi bi-search"></i><span>套用篩選</span></button>
      </div>
    </div>
    <div id="order-search-loading" class="htmx-indicator orders-loading">讀取中…</div>
  </form>
</section>

<div id="order-results">
  {% include "order_results.html" %}
</div>
{% endblock %}
